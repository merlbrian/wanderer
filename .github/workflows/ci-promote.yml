name: CI — Promote to Prod

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  promote:
    name: Retag dev image as prod
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify merge commit
        run: |
          if ! git rev-parse HEAD^2 >/dev/null 2>&1; then
            echo "HEAD is not a merge commit — nothing to promote."
            exit 1
          fi

      - name: Compute image tags
        id: tags
        run: |
          # HEAD^2 is the tip of the merged PR branch — matches the SHA used in ci-dev.yml
          PR_SHA=$(git rev-parse HEAD^2 | cut -c1-7)
          MERGE_SHA=$(git rev-parse --short HEAD)
          IMAGE="ghcr.io/merlbrian/wanderer"
          echo "source=${IMAGE}:develop-${PR_SHA}" >> "$GITHUB_OUTPUT"
          echo "target=${IMAGE}:main-${MERGE_SHA}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Promote dev image to prod
        run: |
          docker buildx imagetools create \
            -t ${{ steps.tags.outputs.target }} \
            -t ghcr.io/merlbrian/wanderer:latest \
            ${{ steps.tags.outputs.source }}
